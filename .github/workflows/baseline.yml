name: Phase 0 offline baseline
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Provision hash-locked dependencies only
        shell: bash
        run: |
          python -B -m venv .phase0/venv
          .phase0/venv/bin/python -B -m pip --isolated --disable-pip-version-check install --require-hashes -r WalletHunterV05_final/requirements-build.lock
          .phase0/venv/bin/python -B -m pip --isolated --disable-pip-version-check install --require-hashes --no-build-isolation -r WalletHunterV05_final/requirements-dev.lock
          .phase0/venv/bin/python -B -m pip --isolated check
      - name: Run source guards and tests with OS networking disabled
        shell: bash
        run: bash tools/baseline/ci_offline.sh
